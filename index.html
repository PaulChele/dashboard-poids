<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Poids</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --text-secondary: #666666;
    --text-muted: #999999;
    --border: #e5e5e5;
    --success: #1d9e75;
    --danger: #d85a30;
    --accent: #185fa5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --text: #f5f5f5;
      --text-secondary: #aaaaaa;
      --text-muted: #777777;
      --border: #333333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }
  .card {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 16px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: color-mix(in srgb, var(--border) 30%, transparent);
    border-left: 3px solid var(--stat-color, var(--border));
    border-radius: 8px;
    padding: 1rem;
  }
  .stat.c-accent { --stat-color: var(--accent); }
  .stat.c-success { --stat-color: var(--success); }
  .stat.c-danger { --stat-color: var(--danger); }
  .stat.c-muted { --stat-color: var(--text-muted); }
  .stat .label { margin-bottom: 6px; }
  .stat .value { font-size: 24px; font-weight: 500; }
  .stat .unit { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .two-col { grid-template-columns: 1fr; }
  }
  .delta { font-size: 12px; margin-top: 4px; color: var(--text-secondary); }
  .progress-wrap { margin-top: 16px; }
  .progress-track {
    height: 8px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }
  svg { width: 100%; height: 100px; display: block; overflow: visible; }
  svg circle {
    transition: r 0.15s;
    cursor: pointer;
  }
  svg circle:hover { r: 6; }
  .add-form {
    border-top: 0.5px solid var(--border);
    margin-top: 12px;
    padding-top: 16px;
    display: flex;
    gap: 8px;
  }
  input, button {
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  input[type="date"] { flex: 1; }
  input[type="number"] { width: 100px; }
  button {
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: color-mix(in srgb, var(--border) 40%, transparent); }
  .exo-row {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .exo-row:last-child { border-bottom: none; }
  .exo-row .name { font-weight: 500; margin-bottom: 3px; }
  .exo-row .reps { color: var(--text-secondary); line-height: 1.4; }
  .kcal {
    border-top: 0.5px solid var(--border);
    margin-top: 12px;
    padding-top: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .meal-block {
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .meal-block:last-child { border-bottom: none; }
  .meal-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .meal-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .meal-time {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .meal-items { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .meal-total {
    border-top: 0.5px solid var(--border);
    margin-top: 8px;
    padding-top: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="label">Dashboard poids</span>
    <span class="label" id="today-date"></span>
  </header>

  <div class="card">
    <div class="label" style="margin-bottom:12px;">Suivi du poids</div>
    <div class="stats-grid">
      <div class="stat c-accent">
        <div class="label">Actuel</div>
        <div class="value" id="stat-current">— <span class="unit">kg</span></div>
        <div class="delta" id="stat-week-delta"></div>
      </div>
      <div class="stat c-muted" id="stat-remaining-card">
        <div class="label">Restant</div>
        <div class="value" id="stat-remaining">— <span class="unit">kg</span></div>
      </div>
      <div class="stat c-muted">
        <div class="label">Objectif</div>
        <div class="value">75.0 <span class="unit">kg</span></div>
      </div>
    </div>
    <svg id="chart" viewBox="0 0 600 100"></svg>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-labels">
        <span id="progress-start"></span>
        <span id="progress-pct" class="label"></span>
        <span>75 kg</span>
      </div>
    </div>
    <form class="add-form" id="add-form">
      <input type="date" id="input-date" required>
      <input type="number" id="input-weight" placeholder="82.4" step="0.1" required>
      <button type="submit">Ajouter</button>
    </form>
  </div>

  <div class="two-col">
    <div class="card">
      <div class="label" id="bigg-title" style="margin-bottom:10px;">Séance du jour</div>
      <div id="bigg-content"></div>
    </div>

    <div class="card">
      <div class="label" id="recette-title" style="margin-bottom:10px;">Recette du jour</div>
      <div id="recette-content"></div>
    </div>
  </div>

</div>

  function renderRecette() {

    const prog = MEALS[day];
    const container = document.getElementById("recette-content");
    container.innerHTML = "";
    prog.meals.forEach(m => {
      const block = document.createElement("div");
      block.className = "meal-block";
      block.innerHTML = `
        <div class="meal-head">
          <span class="meal-label">${m.label}</span>

  // ---- Poids : chargement, stats, graphique ----
  async function loadWeights() {
    const { data, error } = await sb
      .from("weights")
      .select("date, weight")
      .order("date", { ascending: true });
    if (error) {
      console.error("Erreur chargement poids:", error);
      return;
    }
    renderStats(data);
    renderChart(data);
  }

  const GOAL = 75.0;

  function renderStats(data) {
    if (!data.length) return;
    const current = data[data.length - 1].weight;
    const startWeight = data[0].weight;
    document.getElementById("stat-current").innerHTML = `${current.toFixed(1)} <span class="unit">kg</span>`;

    // Restant vers objectif
    const remaining = current - GOAL;
    const remainCard = document.getElementById("stat-remaining-card");
    document.getElementById("stat-remaining").innerHTML =
      remaining <= 0
        ? `Atteint <span class="unit">🎯</span>`
        : `${remaining.toFixed(1)} <span class="unit">kg</span>`;
    remainCard.className = "stat " + (remaining <= 0 ? "c-success" : "c-accent");

    // Delta 7 jours (affiché en petit sous "Actuel")
    const weekAgoDate = new Date(today);
    weekAgoDate.setDate(weekAgoDate.getDate() - 7);
    const pastPoint = [...data].reverse().find(d => new Date(d.date) <= weekAgoDate);
    const deltaEl = document.getElementById("stat-week-delta");
    if (pastPoint) {
      const diff = current - pastPoint.weight;
      const sign = diff > 0 ? "+" : "";
      deltaEl.textContent = `${sign}${diff.toFixed(1)} kg sur 7 jours`;
      deltaEl.style.color = diff <= 0 ? "var(--success)" : "var(--danger)";
    } else {
      deltaEl.textContent = "";
    }

    // Barre de progression : première pesée enregistrée → objectif
    const totalToLose = startWeight - GOAL;
    const doneSoFar = startWeight - current;
    const pct = totalToLose > 0 ? Math.max(0, Math.min(100, (doneSoFar / totalToLose) * 100)) : 100;
    document.getElementById("progress-fill").style.width = pct.toFixed(0) + "%";
    document.getElementById("progress-start").textContent = `${startWeight.toFixed(1)} kg`;
    document.getElementById("progress-pct").textContent = `${pct.toFixed(0)}%`;
  }

  function renderChart(data) {
    const svg = document.getElementById("chart");
    if (data.length < 2) {
      svg.innerHTML = "";
      return;
    }
    const weights = data.map(d => d.weight);
    const min = Math.min(...weights);
    const max = Math.max(...weights);
    const range = max - min || 1;
    const w = 600, h = 100, pad = 10;
    const coords = data.map((d, i) => {
      const x = (i / (data.length - 1)) * w;
      const y = h - pad - ((d.weight - min) / range) * (h - 2 * pad);
      return { x, y, date: d.date, weight: d.weight };
    });
    const linePoints = coords.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const areaPoints = `0,${h} ` + linePoints + ` ${w},${h}`;

    const dateFmt = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

    let circles = coords.map(p => `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)">
        <title>${dateFmt(p.date)} — ${p.weight.toFixed(1)} kg</title>
      </circle>`).join("");

    svg.innerHTML = `
      <polygon points="${areaPoints}" fill="color-mix(in srgb, var(--accent) 12%, transparent)" stroke="none"/>
      <polyline points="${linePoints}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${circles}`;
  }

  // ---- Ajout d'une pesée ----
  document.getElementById("add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const date = document.getElementById("input-date").value;
    const weight = parseFloat(document.getElementById("input-weight").value);
    if (!date || isNaN(weight)) return;

    const { error } = await sb
      .from("weights")
      .upsert({ date, weight }, { onConflict: "date" });

    if (error) {
      console.error("Erreur ajout:", error);
      alert("Erreur lors de l'ajout, regarde la console.");
      return;
    }
    document.getElementById("input-weight").value = "";
    loadWeights();
  });

  loadWeights();
</script>

</html>
